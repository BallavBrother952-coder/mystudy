<!DOCTYPE html>
<html lang="en">
<head>
  <title>Class 9 | Physics World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>
    .batch-box{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
      margin-top:30px;
    }

    .batch-box .card{
      width:240px;
      padding:25px;
      border-radius:12px;
      background:white;
      font-weight:bold;
      text-align:center;
      cursor:pointer;
      box-shadow:0 4px 15px rgba(0,0,0,.15);
      transition:.3s;
    }

    .batch-box .card:hover{
      background:#138808;
      color:white;
      transform:translateY(-5px);
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">Physics World</div>
  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="#batches">Batches</a>
    <a href="#" id="authBtn">Login</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Class 9 – Welcome to Physics World</h1>
  <p>Select your batch to continue</p>
</section>

<!-- BATCHES -->
<section class="batches" id="batches">
  <h2 style="text-align:center">Select Your Batch</h2>

  <div class="batch-box">
    <div class="card" onclick="openBatch('Board Exam Batch')">
      Board Exam Batch
    </div>

    <div class="card" onclick="openBatch('Foundation Batch')">
      Foundation Batch
    </div>

    <div class="card" onclick="openBatch('Crash Course Batch')">
      Crash Course Batch
    </div>
  </div>
</section>

<script>
// LOGIN / LOGOUT
const authBtn = document.getElementById("authBtn");

if (localStorage.getItem("loggedIn") === "yes") {
  authBtn.innerText = "Logout";
  authBtn.onclick = () => {
    localStorage.removeItem("loggedIn");
    window.location.href = "login.html";
  };
} else {
  authBtn.innerText = "Login";
  authBtn.onclick = () => window.location.href = "login.html";
}

// OPEN BATCH → SUBJECT PAGE
function openBatch(batchName) {
  window.location.href =
    `class9-subjects.html?batch=${encodeURIComponent(batchName)}`;
}
</script>

</body>
</html>
