<!DOCTYPE html>
<html>
<head>
  <title>Class 11</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{font-family:Arial;margin:0;background:#f4f6f8}
    header{background:#5a2dff;color:white;padding:20px;text-align:center}
    .box{display:flex;justify-content:center;gap:25px;margin-top:60px;flex-wrap:wrap}
    .card{
      width:260px;padding:30px;background:white;border-radius:12px;
      font-weight:bold;text-align:center;cursor:pointer;
      box-shadow:0 4px 15px rgba(0,0,0,.15);transition:.3s
    }
    .card:hover{background:#138808;color:white;transform:translateY(-5px)}
  </style>
</head>
<body>

<header>
  <h1>Class 11</h1>
  <p>Select Your Stream</p>
</header>

<div class="box">
  <div class="card" onclick="go('science')">🔬 Science</div>
  <div class="card" onclick="go('arts')">🎨 Arts</div>
  <div class="card" onclick="go('commerce')">💼 Commerce</div>
</div>

<script>
function go(stream){
  window.location.href = "class11-batches.html?stream=" + stream;
}
</script>

</body>
</html>
