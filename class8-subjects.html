<!DOCTYPE html>
<html>
<head>
  <title>Class 8 Subjects | Physics World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    header {
      background: #5a2dff;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .subject-box {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 30px;
    }

    .card {
      width: 240px;
      padding: 25px;
      border-radius: 12px;
      background: white;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
      transition: .3s;
    }

    .card:hover {
      background: #138808;
      color: white;
      transform: translateY(-5px);
    }
  </style>
</head>

<body>

<header>
  <h1>Class 8 Subjects</h1>
  <p id="batchName"></p>
</header>

<div class="subject-box" id="subjectList"></div>

<script>
/* READ URL DATA */
const params = new URLSearchParams(window.location.search);
const batch = params.get("batch");

document.getElementById("batchName").innerText = batch;

/* CLASS 8 SUBJECTS */
const subjects = [
  "Atit O Atithya VIII",
  "Blossom VIII",
  "Ganit Prabha VIII",
  "Geography VIII",
  "Geography VIII",
  "Paribesh O Bigyan VIII",
  "Pather Panchali VIII",
  "Sahityamela VIII"
];

const list = document.getElementById("subjectList");

/* LOAD SUBJECTS */
subjects.forEach(subject => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerText = subject;

  div.onclick = () => {
    alert(`${subject} selected\n${batch}`);
    // next: subject → chapter page
  };

  list.appendChild(div);
});
</script>

</body>
</html>
