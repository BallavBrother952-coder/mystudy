<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class 5 | Physics World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:linear-gradient(90deg,#FF9933,#fff,#138808);
  font-weight:bold;
}
.menu a{
  margin-left:20px;
  text-decoration:none;
  color:#000;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px;
  background:linear-gradient(45deg,#FFB347,#FFCC33,#33CCFF,#33FF99);
  color:#fff;
}

/* BATCHES */
.batches{
  padding:60px 20px;
  text-align:center;
  background:#f2f2f2;
}
.batch-box{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}
.batch-card{
  width:220px;
  padding:25px;
  background:#fff;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
  transition:.3s;
}
.batch-card:hover{
  background:#138808;
  color:#fff;
  transform:scale(1.05);
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div>Physics World</div>
  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="#batches">Batches</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Class 5</h1>
  <p>Select your batch and start learning</p>
</section>

<!-- BATCH SECTION -->
<section class="batches" id="batches">
  <h2>Select Your Batch</h2>
  <div class="batch-box">
    <div class="batch-card" onclick="openBatch('Board Exam')">
      Board Exam Batch
    </div>
    <div class="batch-card" onclick="openBatch('Foundation')">
      Foundation Batch
    </div>
    <div class="batch-card" onclick="openBatch('Crash Course')">
      Crash Course Batch
    </div>
  </div>
</section>

<script>
function openBatch(batchName){
  window.location.href =
    "class5-subjects.html?batch=" + encodeURIComponent(batchName);
}
</script>

</body>
</html>
