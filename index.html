<!DOCTYPE html>
<html>
<head>
  <title>Physics World | Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; font-family: Arial, sans-serif; }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808);
      color: white;
      font-weight: bold;
    }
    .logo { font-size: 24px; }
    .menu a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-weight: 600;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(45deg, #FFB347, #FFCC33, #33CCFF, #33FF99);
      color: #fff;
    }
    .hero h1 { font-size: 48px; }
    .hero p { font-size: 20px; }

    /* CLASSES */
    .classes {
      padding: 60px 20px;
      text-align: center;
      background: linear-gradient(135deg, #FF9999, #99CCFF);
    }
    .class-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 25px;
      max-width: 900px;
      margin: auto;
    }
    .card {
      padding: 30px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 120px;
      transition: .3s;
    }
    .card:hover { transform: scale(1.1); }

    .card:nth-child(1){background:#FF9933;}
    .card:nth-child(2){background:#138808;}
    .card:nth-child(3){background:#FF3300;}
    .card:nth-child(4){background:#33CCFF;}
    .card:nth-child(5){background:#FFCC00;}
    .card:nth-child(6){background:#FF66CC;}
    .card:nth-child(7){background:#33FF99;}
    .card:nth-child(8){background:#5803f6;}
    .card:nth-child(9){background:#ea03f6;}
  </style>
</head>

<body>

<header class="header">
  <div class="logo">Physics World</div>
  <nav class="menu">
    <a href="#classes">Classes</a>
  </nav>
</header>

<section class="hero">
  <h1>Learn Anytime, Anywhere</h1>
  <p>Classes 5 to 12 | Videos | Notes | Tests</p>
</section>

<section class="classes" id="classes">
  <h2>Choose Your Class</h2>
  <div class="class-box">
    <a href="class5.html" class="card">Class 5</a>
    <a href="class6.html" class="card">Class 6</a>
    <a href="class7.html" class="card">Class 7</a>
    <a href="class8.html" class="card">Class 8</a>
    <a href="class9.html" class="card">Class 9</a>
    <a href="class10.html" class="card">Class 10</a>
    <a href="class11.html" class="card">Class 11</a>
    <a href="class12.html" class="card">Class 12</a>
    <a href="anm-gnm/anm-gnm.html" class="card">ANM/GNM</a>
  </div>
</section>

</body>
</html>
