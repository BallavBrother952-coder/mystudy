<!DOCTYPE html>
<html>
<head>
  <title>Class 7 | Physics World</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .batch-box {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 40px;
    }

    .card {
      width: 230px;
      padding: 25px;
      border-radius: 12px;
      background: white;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
      transition: .3s;
    }

    .card:hover {
      background: #138808;
      color: white;
      transform: translateY(-5px);
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">Physics World</div>
  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="#" id="authBtn">Login</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Class 7</h1>
  <p>Select your batch</p>
</section>

<!-- BATCHES -->
<section>
  <div class="batch-box">
    <div class="card" onclick="openBatch('Board Exam Batch')">Board Exam Batch</div>
    <div class="card" onclick="openBatch('Foundation Batch')">Foundation Batch</div>
    <div class="card" onclick="openBatch('Crash Course Batch')">Crash Course Batch</div>
  </div>
</section>

<script>
/* LOGIN / LOGOUT */
const authBtn = document.getElementById("authBtn");

if (localStorage.getItem("loggedIn") === "yes") {
  authBtn.innerText = "Logout";
  authBtn.onclick = () => {
    localStorage.removeItem("loggedIn");
    window.location.href = "login.html";
  };
} else {
  authBtn.innerText = "Login";
  authBtn.onclick = () => window.location.href = "login.html";
}

/* OPEN SUBJECT PAGE */
function openBatch(batchName) {
  window.location.href =
    `class7-subjects.html?class=7&batch=${encodeURIComponent(batchName)}`;
}
</script>

</body>
</html>
