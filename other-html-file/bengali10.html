<!DOCTYPE html>
<html>
<head>
  <title>Class 10 Bengali | Physics World</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header class="header">
  <div class="logo">Physics World</div>
  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="#classes">Classes</a>
    <a href="#courses">Courses</a>
    <a href="#" id="authBtn">Login</a>
  </nav>
</header>

<section class="subject">
  <h2>Class 10 – Bengali</h2>

  <div class="tabs">
    <button onclick="showTab('video')">Videos</button>
    <button onclick="showTab('notes')">Notes</button>
    <button onclick="showTab('test')">Tests</button>
  </div>

  <div id="video" class="tab-content"></div>
  <div id="notes" class="tab-content" style="display:none"></div>
  <div id="test" class="tab-content" style="display:none"></div>
</section>

<script>
window.onload = function() {
  const authBtn = document.getElementById("authBtn");
  const loggedIn = localStorage.getItem("loggedIn") === "yes";

  if(loggedIn){
    authBtn.innerText = "Logout";
    authBtn.onclick = function(){
      localStorage.removeItem("loggedIn");
      window.location.href = "login.html";
    };

    document.getElementById("video").innerHTML = `
      <h3>Lecture 1: Real Numbers</h3>
      <iframe width="100%" height="450" src="https://www.youtube.com/embed/VIDEO_ID" allowfullscreen></iframe>
    `;
    document.getElementById("notes").innerHTML = `
      <h3>Download Notes</h3>
      <a href="notes/math10.pdf" class="note-btn">📄 Download PDF</a>
    `;
    document.getElementById("test").innerHTML = `
      <h3>Chapter Test</h3>
      <button class="test-btn">Start Test</button>
    `;
  } else {
    document.getElementById("video").innerHTML = "<p style='color:red'>Please login to access videos.</p>";
    document.getElementById("notes").innerHTML = "<p style='color:red'>Please login to access notes.</p>";
    document.getElementById("test").innerHTML = "<p style='color:red'>Please login to access tests.</p>";
  }
};

function showTab(tabId){
  document.querySelectorAll('.tab-content').forEach(tab => tab.style.display='none');
  document.getElementById(tabId).style.display='block';

  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.style.backgroundColor = '#5a2dff';
    btn.style.color = 'white';
  });

  const activeBtn = document.querySelector(`.tabs button[onclick="showTab('${tabId}')"]`);
  if(activeBtn){
    activeBtn.style.backgroundColor = '#4a23cc';
    activeBtn.style.color = 'white';
  }
}
</script>

</body>
</html>
