<!DOCTYPE html>
<html>
<head>
  <title>Class 10 Mathematics | Foundation Batch | Physics World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">Physics World</div>
  <nav class="menu">
    <a href="batch10_foundation.html">Foundation Batch</a>
    <a href="#" id="authBtn">Login</a>
  </nav>
</header>

<section class="hero">
  <h1>Class 10 – Mathematics</h1>
  <p>Foundation Batch • Chapter-wise Learning</p>
</section>

<section class="classes">
  <h2>Chapters</h2>

  <div class="class-box">
    <div class="card" onclick="openChapter(1)">Chapter 1: Real Numbers</div>
    <div class="card" onclick="openChapter(2)">Chapter 2: Polynomials</div>
    <div class="card" onclick="openChapter(3)">Chapter 3: Linear Equations</div>
  </div>
</section>

<section class="subject" id="chapterContent" style="display:none">
  <h2 id="chapterTitle"></h2>

  <h3>Videos</h3>
  <ul>
    <li><a href="#">▶ Lecture 1</a></li>
    <li><a href="#">▶ Lecture 2</a></li>
    <li><a href="#">▶ Lecture 3</a></li>
  </ul>

  <br>

  <a href="#" class="note-btn">📄 Download Notes</a>
  <br><br>
  <button class="test-btn">Start Test</button>
</section>

<script>
function openChapter(ch) {
  document.getElementById("chapterContent").style.display = "block";

  const titles = {
    1: "Chapter 1: Real Numbers",
    2: "Chapter 2: Polynomials",
    3: "Chapter 3: Linear Equations"
  };

  document.getElementById("chapterTitle").innerText = titles[ch];
}

// login
const authBtn = document.getElementById("authBtn");
if (localStorage.getItem("loggedIn") === "yes") {
  authBtn.innerText = "Logout";
  authBtn.onclick = () => {
    localStorage.removeItem("loggedIn");
    window.location.href = "login.html";
  };
} else {
  authBtn.innerText = "Login";
  authBtn.onclick = () => window.location.href = "login.html";
}
</script>

</body>
</html>
