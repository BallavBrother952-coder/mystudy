<!DOCTYPE html>
<html>
<head>
  <title>Class 12 Batches</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{font-family:Arial;margin:0;background:#f4f6f8}
    header{background:#5a2dff;color:white;padding:20px;text-align:center}
    .box{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:30px}
    .card{
      width:280px;padding:25px;background:white;border-radius:12px;
      text-align:center;font-weight:bold;cursor:pointer;
      box-shadow:0 4px 15px rgba(0,0,0,.15);transition:.3s
    }
    .card:hover{background:#138808;color:white;transform:translateY(-5px)}
  </style>
</head>
<body>

<header>
  <h1 id="title">Class 12 Batches</h1>
</header>

<div class="box" id="batchBox"></div>

<script>
const params = new URLSearchParams(window.location.search);
const stream = params.get("stream");

const batches = {
  science: [
    "Board Booster Batch",
    "Advanced Science Batch",
    "JEE / NEET Final Target Batch"
  ],
  arts: [
    "Board Excellence Batch",
    "Honours Preparation Batch",
    "CUET Focus Batch"
  ],
  commerce: [
    "Accounts Advanced Batch",
    "Board + CUET Batch",
    "Commerce Excellence Batch"
  ]
};

document.getElementById("title").innerText =
  "Class 12 – " + stream.toUpperCase();

const box = document.getElementById("batchBox");

batches[stream].forEach(batch=>{
  const div = document.createElement("div");
  div.className = "card";
  div.innerText = batch;
  div.onclick = () => {
    window.location.href =
      "class12-subjects.html?stream=" + stream +
      "&batch=" + encodeURIComponent(batch);
  };
  box.appendChild(div);
});
</script>

</body>
</html>
